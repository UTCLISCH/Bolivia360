<!DOCTYPE html>

<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.map-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAZwOFskL1h3oW6vQjHYbR3DYzPHJyJSfcfUZ-W1JveDMAiFcCZY5PQOypvreSIR4-waRi6m6CSG5Q462NlUMdYjDFwwSH7X64tXGYMpHLxSvbKic-_9DMn2EW23NphB06GIHWawiq5LPxg49tBUcH0IVjOGHGyEZsf3e9BbZ6FeTMmJGugdbCtojqT4E2RCYxzOPi6coOWWjBTC_rhviOhVOD2c54-ZzXG6U_40CnZV6b6_P6a6CVwjUf_aIkd1BjtP4esMf6ZGxZx);
    background-size: cover;

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-lg overflow-hidden h-screen flex flex-col">
<!-- Top Navigation Anchor (As sub-page, TopAppBar logic applied) -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 h-touch-target bg-surface-container-lowest/85 backdrop-blur-xl rounded-xl mt-margin-mobile mx-margin-mobile shadow-md">
<div class="flex items-center gap-3">
<button class="w-touch-target h-touch-target flex items-center justify-center text-primary transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-md-mobile font-headline-md-mobile text-primary tracking-tight">Rutas</h1>
</div>
<div class="flex items-center gap-2">
<button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-all rounded-full">
<span class="material-symbols-outlined">share</span>
</button>
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden">
<img alt="Perfil" class="w-full h-full object-cover" data-alt="A professional headshot of a young adult with a friendly expression, set against a clean, neutral studio background. The lighting is soft and even, characteristic of high-end corporate photography. The style is modern and minimalist, aligning with a premium digital utility aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrcpKhFm1YKBwuU5S7nx5bZAm9IvbbVLVOeUKpyKwmAnXZU35O_tUfvY5HIUwaz5AQjK5uFcZkjAmb_piIFI_cI8l7PLmZEmR5NHUzBuOmIXtpXdu34PaRuo3l7EC-IOzu29zsnUFV4dl4a0q9nnWUMzRN5HrtlQJ5aQ3WVdyXP1xl5n7xvXJctHZ4E2_02rFzzrGGq0AXnFQXkTHdW9p5zdfbO3n24Ju_n48qpC8Le18YO7OrFsye_x6rYXIYsoXwH1cyBeIoeONB"/>
</div>
</div>
</header>
<!-- Main Map Canvas -->
<main class="flex-1 relative w-full h-full bg-surface-dim">
<!-- Simulated Map Background with Route -->
<div class="absolute inset-0 map-bg grayscale-[0.2]" data-location="San Francisco" title="Mapa">
<!-- SVG Overlay for Route Line -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 1000 1000">
<!-- Drop Shadow for Route Line Depth -->
<path class="blur-sm" d="M 200 800 Q 400 600 500 400 T 800 200" fill="none" stroke="rgba(0, 74, 198, 0.2)" stroke-linecap="round" stroke-width="12"></path>
<!-- Primary Route Line -->
<path d="M 200 800 Q 400 600 500 400 T 800 200" fill="none" stroke="#004ac6" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
</svg>
<!-- Destination Pins -->
<div class="absolute top-[20%] right-[20%] -translate-x-1/2 -translate-y-full">
<div class="flex flex-col items-center">
<div class="bg-primary text-on-primary px-3 py-1 rounded-full text-label-caps font-label-caps mb-1 shadow-lg">Trabajo</div>
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<div class="absolute bottom-[20%] left-[20%] -translate-x-1/2 -translate-y-full">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-on-surface-variant text-[32px]" style="font-variation-settings: 'FILL' 1;">radio_button_checked</span>
</div>
</div>
</div>
<!-- Floating Map Controls -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-2">
<button class="w-11 h-11 bg-surface-container-lowest/90 backdrop-blur-md rounded-xl shadow-md flex items-center justify-center text-on-surface-variant active:scale-95 transition-all">
<span class="material-symbols-outlined">layers</span>
</button>
<button class="w-11 h-11 bg-surface-container-lowest/90 backdrop-blur-md rounded-xl shadow-md flex items-center justify-center text-on-surface-variant active:scale-95 transition-all">
<span class="material-symbols-outlined">add</span>
</button>
<button class="w-11 h-11 bg-surface-container-lowest/90 backdrop-blur-md rounded-xl shadow-md flex items-center justify-center text-on-surface-variant active:scale-95 transition-all border-t border-outline-variant/10">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="w-11 h-11 bg-primary text-on-primary rounded-xl shadow-lg flex items-center justify-center mt-2 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</div>
<!-- Floating Context Chips -->
<div class="absolute top-24 left-4 right-4 flex gap-2 overflow-x-auto no-scrollbar py-2">
<div class="flex-none bg-surface-container-lowest/90 backdrop-blur-md border border-outline-variant/30 px-4 py-2 rounded-full shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">local_gas_station</span>
<span class="text-label-caps font-label-caps">Gasolina</span>
</div>
<div class="flex-none bg-surface-container-lowest/90 backdrop-blur-md border border-outline-variant/30 px-4 py-2 rounded-full shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-primary">local_parking</span>
<span class="text-label-caps font-label-caps">Parking</span>
</div>
<div class="flex-none bg-surface-container-lowest/90 backdrop-blur-md border border-outline-variant/30 px-4 py-2 rounded-full shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-tertiary">restaurant</span>
<span class="text-label-caps font-label-caps">Comida</span>
</div>
</div>
<!-- Route Detail Bottom Sheet -->
<div class="absolute bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-xl rounded-t-[32px] shadow-[0_-8px_24px_rgba(0,0,0,0.08)] p-gutter pb-10">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mx-auto mb-6"></div>
<div class="flex justify-between items-start mb-6">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="text-display-navigation-mobile font-display-navigation-mobile text-on-surface">15 min</span>
<span class="text-body-lg font-body-lg text-on-surface-variant">(4.2 km)</span>
</div>
<div class="flex items-center gap-2">
<span class="flex items-center justify-center w-5 h-5 rounded-full bg-secondary text-on-secondary">
<span class="material-symbols-outlined text-[14px]">bolt</span>
</span>
<span class="text-body-sm font-body-sm text-secondary font-semibold">Ruta más corta encontrada</span>
</div>
</div>
<button class="p-3 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-variant active:scale-90 transition-all">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
<!-- Bento-style Action Grid -->
<div class="grid grid-cols-2 gap-3 mb-6">
<button class="flex items-center justify-center gap-2 py-4 px-6 rounded-2xl bg-surface-container border border-outline-variant/20 text-on-surface font-semibold hover:bg-surface-variant/40 transition-all active:scale-95">
<span class="material-symbols-outlined text-error">favorite</span>
                    Guardar en Favoritos
                </button>
<button class="flex items-center justify-center gap-2 py-4 px-6 rounded-2xl bg-surface-container border border-outline-variant/20 text-on-surface font-semibold hover:bg-surface-variant/40 transition-all active:scale-95">
<span class="material-symbols-outlined">add_road</span>
                    Añadir parada
                </button>
</div>
<!-- Primary Action -->
<button class="w-full h-[64px] bg-primary-container text-on-primary-container rounded-2xl flex items-center justify-center gap-3 shadow-lg shadow-primary-container/20 hover:bg-primary-container/90 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">navigation</span>
<span class="text-headline-md font-headline-md">Iniciar Navegación</span>
</button>
</div>
</main>
<!-- Contextual FAB Suppression: FAB is not rendered on Detail screens as per guidelines -->
<!-- Navigation Shell Placeholder (Not visible on task-focused Detail screens as per Destination Rule) -->
</body></html>
